services:
  sciscinet-dashboard:
    build: .
    container_name: sciscinet-dashboard
    restart: unless-stopped
    # Use userland-proxy=false mode via extra_hosts
    ports:
      # Published on loopback only: cloudflared runs on the host and connects to
      # localhost, so the tunnel still works, but the origin is not reachable
      # from the LAN. Do NOT "fix" this by changing the container's own bind —
      # Dockerfile sets HOSTNAME=0.0.0.0 deliberately, because 127.0.0.1 inside
      # the container is the container's loopback, not the host's.
      - "127.0.0.1:3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount data directory (needs write access for cache.db)
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      # Public origin, used for metadataBase, canonicals and sitemap URLs.
      - SITE_URL=https://explore.metascienceobservatory.org
    # middleware.ts logs every request. Without rotation a large crawl can fill
    # the disk holding the databases.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Resource limits to prevent DoS
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
        reservations:
          memory: 512M
    # Drop all Linux capabilities - container doesn't need any
    cap_drop:
      - ALL
    # Security options
    security_opt:
      - no-new-privileges:true
    # Temp filesystem for /tmp
    tmpfs:
      - /tmp:size=100M,mode=1777

# NOTE: Run cloudflared outside Docker for simpler credential management:
#   cloudflared tunnel run sciscinet-dashboard
